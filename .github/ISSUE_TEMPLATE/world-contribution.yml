name: "World Contribution Slot (Good First Issue)"
description: "Student contribution slot for adding a paper-collage object into any Growing World segment"
title: "🌱 Add a <Object Name> to <World Name> — <Segment Name> (SLOT #<01-20>)"
labels: ["good first issue"]
body:
