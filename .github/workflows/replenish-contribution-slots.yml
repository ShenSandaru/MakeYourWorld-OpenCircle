name: Replenish Contribution Slots Pool

on:
  issues:
    types:
      - closed
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run mode (calculates missing slots without creating issues)"
        type: boolean
        required: false
        default: false

concurrency:
  group: contribution-slot-replenishment
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  replenish-slots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code for scripts & generator catalog
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare and Execute Slot Replenishment Engine
        uses: actions/github-script@v7
        id: compute-replenishment
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            const eventName = context.eventName;
            const action = context.payload.action || 'dispatched';
            const closedIssue = context.payload.issue;
            const isDryRun = process.env.DRY_RUN === 'true';

            console.log("=================================================");
            console.log("Growing Worlds Contribution Pool Replenishment");
            console.log("=================================================");
            console.log(`Event:       ${eventName}`);
            console.log(`Action:      ${action}`);
            console.log(`Dry Run:     ${isDryRun ? 'YES' : 'NO'}`);
            console.log(`Target Pool: 20 open contribution issues\n`);

            // If triggered by issues.closed, verify if the closed issue was a contribution slot issue
            if (eventName === 'issues' && action === 'closed' && closedIssue) {
              const labels = closedIssue.labels ? closedIssue.labels.map(l => typeof l === 'string' ? l : l.name) : [];
              const isGoodFirstIssue = labels.includes("good first issue");
              const hasContribTitle = closedIssue.title && (closedIssue.title.includes("[Good First Issue]") || closedIssue.title.includes("CONTRIB-SLOT"));
              const hasWorldBody = closedIssue.body && closedIssue.body.includes("Target World") && closedIssue.body.includes("Contribution Slot");

              const isContributionIssue = isGoodFirstIssue || hasContribTitle || hasWorldBody;

              if (!isContributionIssue) {
                console.log(`Closed issue #${closedIssue.number} ("${closedIssue.title}") is NOT a contribution slot issue.`);
                console.log("Replenishment skipped.");
                return;
              }

              console.log(`Contribution issue #${closedIssue.number} closed: "${closedIssue.title}". Proceeding to replenish pool.`);
            }

            // 1. Fetch all currently OPEN issues
            console.log("Fetching currently open issues from repository...");
            const openIssuesRes = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });

            // Filter open issues that are contribution slot issues
            const openContribIssues = openIssuesRes.data.filter(issue => {
              const labels = issue.labels.map(l => typeof l === 'string' ? l : l.name);
              const isGoodFirstIssue = labels.includes("good first issue");
              const hasContribTitle = issue.title && (issue.title.includes("[Good First Issue]") || issue.title.includes("CONTRIB-SLOT"));
              return isGoodFirstIssue || hasContribTitle;
            });

            console.log(`Found ${openContribIssues.length} active open contribution slot issue(s).\n`);

            // Extract active slot numbers (e.g. "CONTRIB-SLOT #01")
            const activeSlots = [];
            const activeAssignments = [];

            for (const issue of openContribIssues) {
              const slotMatch = issue.title.match(/CONTRIB-SLOT #(\d+)/i) || (issue.body && issue.body.match(/CONTRIB-SLOT #(\d+)/i));
              if (slotMatch) {
                activeSlots.push(`CONTRIB-SLOT #${slotMatch[1].padStart(2, '0')}`);
              }
              // Extract world and object (supports both "🌱 Add..." and "[Good First Issue] 🌱 Add...")
              const titleMatch = issue.title.match(/Add (.*?) to (.*?) —/i);
              if (titleMatch) {
                activeAssignments.push({
                  objectName: titleMatch[1].trim(),
                  worldId: titleMatch[2].toLowerCase().replace(/\s+/g, '-'),
                });
              }
            }

            console.log("Active Open Slots:", activeSlots.join(", ") || "None");

            // Write input payload safely to a temporary file (no shell injection)
            const inputPath = path.join(process.cwd(), '.replenish-input.json');
            const outputPath = path.join(process.cwd(), '.replenish-output.json');

            fs.writeFileSync(inputPath, JSON.stringify({
              activeSlots,
              activeAssignments,
              maxPerRun: 5,
            }, null, 2), 'utf-8');

            console.log(`Invoking TypeScript replenishment computation script...`);
            execSync(`npx tsx scripts/run-replenishment.ts "${inputPath}" "${outputPath}"`, { stdio: 'inherit' });

            const resultRaw = fs.readFileSync(outputPath, 'utf-8');
            const result = JSON.parse(resultRaw);

            console.log(`\nReplenishment Pool Audit:`);
            console.log(`  Target Pool:             ${result.targetPoolSize}`);
            console.log(`  Currently Open Slots:    ${result.openContributionCount}`);
            console.log(`  Missing Slot Count:      ${result.missingSlotCount}`);
            console.log(`  Slots To Replenish (Run):${result.slotsToCreate.join(', ') || 'None'}\n`);

            if (result.generatedIssues.length === 0) {
              console.log("✅ Contribution pool is already at target capacity (20/20). Nothing to create.");
              return;
            }

            let createdCount = 0;

            for (const generated of result.generatedIssues) {
              console.log("-------------------------------------------------");
              console.log(`Slot:            ${generated.slotFormatted}`);
              console.log(`Target World:    ${generated.worldName} (${generated.worldId})`);
              console.log(`Object Concept:  ${generated.objectName}`);
              console.log(`Proposed Title:  ${generated.title}`);

              if (isDryRun) {
                console.log("ℹ️ [DRY RUN ENABLED] No issues created.");
              } else {
                console.log(`Creating new contribution issue for ${generated.slotFormatted}...`);
                const createdIssue = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: generated.title,
                  body: generated.body,
                  labels: generated.labels,
                });
                console.log(`✅ Created Issue #${createdIssue.data.number}: ${createdIssue.data.html_url}`);
                createdCount++;
              }
            }

            console.log("\n=================================================");
            console.log(`Pool Replenishment Summary:`);
            console.log(`  Target Pool:     ${result.targetPoolSize}`);
            console.log(`  Previously Open: ${result.openContributionCount}`);
            console.log(`  Created:         ${createdCount}`);
            console.log(`  Total Active:    ${result.openContributionCount + createdCount} / ${result.targetPoolSize}`);
            console.log("=================================================");

            // Cleanup temp files
            if (fs.existsSync(inputPath)) fs.unlinkSync(inputPath);
            if (fs.existsSync(outputPath)) fs.unlinkSync(outputPath);
