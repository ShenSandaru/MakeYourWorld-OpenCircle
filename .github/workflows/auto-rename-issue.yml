name: Auto Rename Issue Slot Title & Contributor Lifecycle

on:
  issues:
    types:
      - opened
      - edited
      - assigned
      - closed
  workflow_dispatch:
    inputs:
      dry_run_body:
        description: "Sample issue body markdown to test parser without modifying real issues"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  update-title-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Process Growing Worlds issue lifecycle
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          script: |
            const eventName = context.eventName;
            const action = context.payload.action || 'dispatched';
            const issue = context.payload.issue;
            const dryRunInput = context.payload.inputs ? context.payload.inputs.dry_run_body : '';
            const body = dryRunInput || (issue ? issue.body : "") || "";
            const issueTitle = issue ? issue.title : "";
            const labels = issue && issue.labels ? issue.labels.map(l => typeof l === 'string' ? l : l.name) : [];

            const hasGoodFirstIssue = labels.includes("good first issue");
            const hasContributionTitle = issueTitle.includes("[Good First Issue]") || issueTitle.includes("[CONTRIB-SLOT");
            const hasWorldFields = body.includes("Target World") && (body.includes("Contribution Slot") || body.includes("Assigned World Segment"));

            const isContributionIssue = eventName === 'workflow_dispatch' || hasGoodFirstIssue || hasContributionTitle || hasWorldFields;

            console.log("=================================================");
            console.log("Growing Worlds Issue Lifecycle");
            console.log("=================================================");
            console.log(`Event:                      ${eventName}`);
            console.log(`Action:                     ${action}`);
            console.log(`Repository:                 ${context.repo.owner}/${context.repo.repo}`);
            console.log(`Issue:                      ${issue ? `#${issue.number}` : 'N/A'}`);
            console.log(`Issue URL:                  ${issue ? issue.html_url : 'N/A'}`);
            console.log(`Title:                      ${issueTitle}`);
            console.log(`Labels:                     ${labels.join(', ') || 'none'}`);
            console.log(`Body present:               ${body ? 'YES' : 'NO'}`);
            console.log(`Contribution issue detected:${isContributionIssue ? 'YES' : 'NO'}`);
            console.log("=================================================\n");

            if (!isContributionIssue) {
              console.log("Not a Growing Worlds contribution issue. Nothing to do.");
              return;
            }

            function escapeRegex(str) {
              return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            }

            function extractIssueFormField(docBody, keywords) {
              if (!docBody) return null;

              for (const keyword of keywords) {
                const regex = new RegExp(
                  `(?:^|\\n)#{1,4}\\s*[^\\r\\n]*?${escapeRegex(keyword)}[^\\r\\n]*[\\r\\n]+([\\s\\S]*?)(?=(?:\\n#{1,4}\\s+|\\n---|\\n\\*\\*|$))`,
                  "i"
                );
                const match = docBody.match(regex);
                if (match && match[1]) {
                  const lines = match[1]
                    .split("\n")
                    .map((l) => l.trim())
                    .filter((l) => l.length > 0 && !l.startsWith(">"));

                  if (lines.length > 0) {
                    const firstLine = lines[0];
                    if (firstLine !== "_No response_" && firstLine !== "No response" && firstLine !== "None") {
                      return firstLine;
                    }
                  }
                }
              }

              for (const keyword of keywords) {
                const listRegex = new RegExp(
                  `(?:^|\\n)[-*]\\s*\\*\\*[^\\r\\n]*?${escapeRegex(keyword)}[^\\r\\n]*?\\*\\*:\\s*` +
                    `(?:\\[e\\.g\\.,?\\s*)?([^\\]\\r\\n]+?)(?:\\])?(?=[\\r\\n]|$)`,
                  "i"
                );
                const match = docBody.match(listRegex);
                if (match && match[1]) {
                  const val = match[1].trim();
                  if (val && val !== "_No response_" && val !== "No response") {
                    return val;
                  }
                }
              }

              return null;
            }

            const rawWorld = extractIssueFormField(body, ["Target World", "world"]);
            const rawSlot = extractIssueFormField(body, ["Contribution Slot Identifier", "Contribution Slot", "slot_id", "slot"]);
            const rawSegment = extractIssueFormField(body, ["Assigned World Segment ID", "Assigned World Segment", "target_segment", "segment"]);
            const rawCategory = extractIssueFormField(body, ["Suggested Object Category & Concept", "Suggested Object Category", "suggested_category", "category"]);
            const rawCustomObject = extractIssueFormField(body, ["Custom Object Name", "custom_object_name"]);

            console.log("Raw Form Fields:");
            console.log(`  Raw World:         ${rawWorld || 'null'}`);
            console.log(`  Raw Slot:          ${rawSlot || 'null'}`);
            console.log(`  Raw Segment:       ${rawSegment || 'null'}`);
            console.log(`  Raw Category:      ${rawCategory || 'null'}`);
            console.log(`  Raw Custom Object: ${rawCustomObject || 'null'}\n`);

            // 1. World Parsing
            let worldName = "";
            let worldId = "";
            if (rawWorld) {
              const idMatch = rawWorld.match(/\(([a-z0-9-]+)\)/i);
              if (idMatch) {
                worldId = idMatch[1].toLowerCase();
              }
              worldName = rawWorld.replace(/\s*\([^)]*\)/, "").trim();
            }

            // 2. Slot Parsing
            let slotFormatted = "";
            if (rawSlot) {
              const numMatch = rawSlot.match(/(\d+)/);
              if (numMatch) {
                slotFormatted = `CONTRIB-SLOT #${numMatch[1].padStart(2, "0")}`;
              }
            }

            // 3. Segment Parsing
            let segmentId = "";
            if (rawSegment) {
              const segmentMatch = rawSegment.match(/([a-z0-9]+-[0-9]+)/i) || rawSegment.match(/([a-z0-9-]+)/i);
              if (segmentMatch) {
                segmentId = segmentMatch[1].toLowerCase();
              }
            }

            // 4. Object Name Parsing
            let objectName = "";
            if (rawCustomObject && rawCustomObject.trim() !== "") {
              objectName = rawCustomObject.replace(/\s*\([^)]*\)/, "").trim();
            } else if (rawCategory && rawCategory.trim() !== "") {
              let cleaned = rawCategory.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{26FF}]/gu, "").trim();
              if (cleaned.includes(":")) {
                cleaned = cleaned.split(":")[1].trim();
              }
              cleaned = cleaned.replace(/\s*\([^)]*\)/, "").trim();
              if (cleaned) {
                objectName = cleaned;
              }
            }

            if (!worldName || !slotFormatted || !segmentId || !objectName) {
              console.error("❌ Contribution issue parsing failed. Missing critical fields:");
              console.error(`  worldName: '${worldName}', slotFormatted: '${slotFormatted}', segmentId: '${segmentId}', objectName: '${objectName}'`);
              return;
            }

            const normalizedTitle = `[Good First Issue] 🌱 Add ${objectName} to ${worldName} — ${segmentId} (${slotFormatted})`;
            const objectSlug = objectName.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
            const branchName = `contrib/${worldId}-${objectSlug || "object"}`;

            console.log("Parsed Metadata:");
            console.log(`  World:            ${worldName}`);
            console.log(`  World ID:         ${worldId}`);
            console.log(`  Slot:             ${slotFormatted}`);
            console.log(`  Segment:          ${segmentId}`);
            console.log(`  Object:           ${objectName}`);
            console.log(`\nNormalized Title:   ${normalizedTitle}`);
            console.log(`Branch Name:        ${branchName}\n`);

            // Safe Dry-Run Mode for workflow_dispatch
            if (eventName === 'workflow_dispatch' && !issue) {
              console.log("ℹ️ workflow_dispatch dry run completed. No real issues modified.");
              return;
            }

            // -------------------------------------------------------------
            // TITLE NORMALIZATION (on 'opened' or 'edited')
            // -------------------------------------------------------------
            if (action === 'opened' || action === 'edited') {
              if (issue.title !== normalizedTitle) {
                console.log(`Title update: Renaming issue #${issue.number} to: "${normalizedTitle}"`);
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  title: normalizedTitle,
                });
                console.log("Title update: SUCCESS");
              } else {
                console.log("Title update: SKIPPED — already normalized");
              }
            }

            // -------------------------------------------------------------
            // DISCORD NOTIFICATIONS & ONBOARDING / COMPLETION COMMENTS
            // -------------------------------------------------------------
            const webhookUrl = process.env.DISCORD_WEBHOOK;

            // Scenario 1: New Slot Opened
            if (action === 'opened') {
              if (webhookUrl) {
                try {
                  console.log("Sending 'New Contribution Slot' notification to Discord...");
                  const discordPayload = {
                    embeds: [
                      {
                        title: `🌿 New World Slot #${issue.number}: ${normalizedTitle}`,
                        url: issue.html_url,
                        description: `A new reusable student contribution slot is open for **${worldName}**!\n\n**World**: ${worldName}\n**Segment**: \`${segmentId}\`\n**Object**: ${objectName}\n**Slot**: \`${slotFormatted}\``,
                        color: 3066993, // Green
                        fields: [
                          { name: "Repository", value: context.repo.repo, inline: true },
                          { name: "Status", value: "🟢 Available (Claimable)", inline: true },
                        ],
                        footer: {
                          text: `Growing Worlds Onboarding • Comment on Issue #${issue.number} to claim!`,
                        },
                      },
                    ],
                  };

                  await fetch(webhookUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(discordPayload),
                  });
                } catch (err) {
                  console.warn("Discord notification error (non-fatal):", err.message);
                }
              }
            }

            // Scenario 2: Slot Assigned to Contributor ('assigned')
            if (action === 'assigned') {
              const assignee = context.payload.assignee ? context.payload.assignee.login : (issue.assignees && issue.assignees[0] ? issue.assignees[0].login : 'Student');
              const marker = `<!-- growing-worlds:onboarding:${issue.number}:${assignee} -->`;

              console.log(`Checking existing comments on issue #${issue.number} for onboarding marker...`);
              const existingComments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
              });

              const alreadyCommented = existingComments.data.some((c) => c.body && c.body.includes(marker));

              if (alreadyCommented) {
                console.log(`Onboarding comment for @${assignee} already exists on issue #${issue.number}. Skipping duplicate.`);
              } else {
                console.log(`Posting onboarding welcome comment for @${assignee} on issue #${issue.number}...`);
                const lines = [
                  marker,
                  "",
                  "## Contribution Assigned",
                  "",
                  `Hi @${assignee},`,
                  "",
                  "You have been assigned to this contribution slot.",
                  "",
                  "### Contribution Details",
                  "",
                  `- **World:** \`${worldName}\``,
                  `- **Segment:** \`${segmentId}\``,
                  `- **Object:** \`${objectName}\``,
                  `- **Branch:** \`${branchName}\``,
                  `- **Issue:** \`#${issue.number}\``,
                  "",
                  "### Next Steps",
                  "",
                  "1. Create your branch from `dev`.",
                  "2. Register your object using an existing asset.",
                  "3. Add the object placement to the assigned segment.",
                  "4. Submit your PR targeting `dev`.",
                  `5. Add **\`Closes #${issue.number}\`** to your PR description.`,
                  "",
                  "Please follow the contribution guidelines before submitting your PR.",
                  "",
                  "Your slot is reserved for **48 hours**.",
                  "",
                  "Thank you for contributing to Growing Worlds."
                ];
                const welcomeComment = lines.join("\n");

                try {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    body: welcomeComment,
                  });
                  console.log("Onboarding comment: POSTED successfully.");
                } catch (err) {
                  console.error("Failed to post welcome comment:", err);
                }
              }

              if (webhookUrl) {
                try {
                  console.log(`Sending 'Slot Assigned to @${assignee}' notification to Discord...`);
                  const discordPayload = {
                    embeds: [
                      {
                        title: `🎯 Slot Claimed: ${normalizedTitle} (#${issue.number})`,
                        url: issue.html_url,
                        description: `This contribution slot has been assigned to **@${assignee}**! 🎉\n\n**World**: ${worldName}\n**Assigned To**: [\`@${assignee}\`](https://github.com/${assignee})\n**Branch**: \`${branchName}\``,
                        color: 15105570, // Orange/Amber
                        fields: [
                          { name: "Assignee", value: `@${assignee}`, inline: true },
                          { name: "Status", value: "🟡 In Progress (48h Reservation)", inline: true },
                        ],
                        footer: {
                          text: `Growing Worlds • Target dev branch with two commits!`,
                        },
                      },
                    ],
                  };

                  await fetch(webhookUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(discordPayload),
                  });
                } catch (err) {
                  console.warn("Discord notification error (non-fatal):", err.message);
                }
              }
            }

            // Scenario 3: Issue Closed / Merged ('closed')
            if (action === 'closed') {
              console.log(`Issue #${issue.number} closed.`);
              const completionMarker = `<!-- growing-worlds:completion:${issue.number} -->`;

              console.log(`Checking existing comments on issue #${issue.number} for completion marker...`);
              const existingComments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
              });

              const alreadyCelebrated = existingComments.data.some((c) => c.body && c.body.includes(completionMarker));

              if (!alreadyCelebrated) {
                console.log(`Posting completion comment on issue #${issue.number}...`);
                const completionLines = [
                  completionMarker,
                  "## 🎉 Contribution Complete & Merged!",
                  "",
                  `This contribution slot has been successfully completed and merged into **${worldName}**! 🌿`,
                  "",
                  "Thank you to the contributor for expanding our growing worlds! Your paper cutout is now a permanent part of the shared diorama."
                ];
                const completionComment = completionLines.join("\n");

                try {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    body: completionComment,
                  });
                  console.log("Completion comment: POSTED successfully.");
                } catch (err) {
                  console.error("Failed to post completion comment:", err);
                }
              }

              if (webhookUrl) {
                try {
                  const discordPayload = {
                    embeds: [
                      {
                        title: `🎉 Contribution Merged: ${normalizedTitle} (#${issue.number})`,
                        url: issue.html_url,
                        description: `This contribution slot has been successfully completed and merged into **${worldName}**! 🌿\n\nThank you to the contributor for expanding our growing worlds!`,
                        color: 65280, // Bright Green
                        fields: [
                          { name: "Status", value: "✅ Merged & Complete", inline: true },
                        ],
                        footer: {
                          text: `Growing Worlds • Open source education in action!`,
                        },
                      },
                    ],
                  };

                  await fetch(webhookUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(discordPayload),
                  });
                } catch (err) {
                  console.warn("Discord notification error (non-fatal):", err.message);
                }
              }
            }
