<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100%" height="100%">
  <defs>
    <!-- Paper cutout drop shadow -->
    <filter id="butterfly-paper-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0a140f" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#butterfly-paper-shadow)">
    <!-- Left Forewing (Layered Amber/Gold Paper) -->
    <path d="M 50 42 C 30 10 12 18 10 38 C 8 52 28 58 50 45 Z" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 48 40 C 34 18 20 24 18 36 C 18 46 32 50 48 40 Z" fill="#FBBF24" opacity="0.9"/>
    <circle cx="28" cy="32" r="3" fill="#B45309"/>
    <circle cx="22" cy="38" r="1.5" fill="#FEF3C7"/>

    <!-- Right Forewing -->
    <path d="M 50 42 C 70 10 88 18 90 38 C 92 52 72 58 50 45 Z" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 52 40 C 66 18 80 24 82 36 C 82 46 68 50 52 40 Z" fill="#FBBF24" opacity="0.9"/>
    <circle cx="72" cy="32" r="3" fill="#B45309"/>
    <circle cx="78" cy="38" r="1.5" fill="#FEF3C7"/>

    <!-- Left Hindwing -->
    <path d="M 50 44 C 32 48 20 62 30 72 C 38 78 48 64 50 48 Z" fill="#D97706" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M 47 47 C 36 52 28 62 34 68 C 40 72 46 62 47 49 Z" fill="#F59E0B" opacity="0.75"/>

    <!-- Right Hindwing -->
    <path d="M 50 44 C 68 48 80 62 70 72 C 62 78 52 64 50 48 Z" fill="#D97706" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M 53 47 C 64 52 72 62 66 68 C 60 72 54 62 53 49 Z" fill="#F59E0B" opacity="0.75"/>

    <!-- Butterfly Body & Head -->
    <path d="M 48 30 Q 50 24 52 30 L 52 56 Q 50 60 48 56 Z" fill="#451A03" stroke="#FFFFFF" stroke-width="1"/>
    
    <!-- Antennae -->
    <path d="M 49 26 Q 44 14 38 16 M 51 26 Q 56 14 62 16" fill="none" stroke="#451A03" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
